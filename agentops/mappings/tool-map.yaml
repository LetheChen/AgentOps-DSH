# 旧工具目录与 DSH 映射表。
#
# 元数据（display_name / description / allowed_domains / requires_human_approval）
# 由旧项目 config/tools/*.yaml 与 api/server.py 的 _BUILTIN_TOOLS 刷新：
#   node --import tsx agentops/scripts/gen-tool-catalogue.ts --write
# mapped / used_by / note 是人工标注，脚本只刷新元数据，不覆盖人工判断。
# mapped: 插件包 + 工具名（运行期真实存在）；null = 尚未迁移，页面标「未迁移」。
# 用法：生成器据此产出 preset 行的 only 列表；`mapped: null` 的条目一律不写进 only。
version: 3
agents: [build_operator, coding_agent, deploy_operator, log_analyst, log_puller, manager, multi-agent-report, oa_assistant, proposal_planner, quality_inspector, smart_analysis, smart_approval, smart_form, smart_ops, smart_query, task_conductor, task_decomposer, task_dispatcher, task_inbox, task_monitor, task_planner, video_creator, weekly-reporter]
tools:
  subagent:
    display_name: "派发子任务"
    description: "启动一个业务 Agent 子代理执行任务；立即返回 subagentId，完成后结果自动回投给派发者。执行方式（skill 或其工作流）由该 Agent 的 preset 声明决定。"
    allowed_domains: [manager]
    requires_human_approval: false
    mapped: { plugin: "@deepseek-ai/dsh-tool-subagent", tool: "subagent" }
    used_by: [manager]
    note: "DSH 原生 delegation 工具；allowedAgentPresets 由生成器按业务 Agent 目录派生"
  send_message:
    display_name: "追问子代理"
    description: "向自己直接派发的子代理追加消息（等价 CLI 的 send_message）。"
    allowed_domains: [manager]
    requires_human_approval: false
    mapped: { plugin: "@deepseek-ai/dsh-tool-subagent-control", tool: "send_message" }
    used_by: [manager]
    note: "子代理 continuable：追问与补指令经此工具"
  interrupt_agent:
    display_name: "取消子代理"
    description: "停止一个自己直接派发的子代理。"
    allowed_domains: [manager]
    requires_human_approval: false
    mapped: { plugin: "@deepseek-ai/dsh-tool-subagent-control", tool: "interrupt_agent" }
    used_by: [manager]
    note: ""
  aggregate:
    display_name: "结果聚合"
    description: "SupAgent 聚合各子任务结果"
    allowed_domains: [manager]
    requires_human_approval: false
    mapped: null
    used_by: [manager]
    note: "无（DSH 的编排由 DAG 引擎承担，不是模型可调工具）"
  approval_flow:
    display_name: "审批流转"
    description: "推进审批流程（提交/批准/驳回/转交）"
    allowed_domains: [smart_approval]
    requires_human_approval: false
    mapped: null
    used_by: [smart_approval, manager, oa_assistant, smart_analysis, smart_form, smart_ops, smart_query]
    note: "无（DSH 审批域未迁移）"
  approval_query:
    display_name: "审批查询"
    description: "查询审批单状态、审批历史"
    allowed_domains: [smart_approval]
    requires_human_approval: false
    mapped: null
    used_by: [smart_approval]
    note: "无（DSH 审批域未迁移）"
  bash:
    display_name: "执行命令"
    description: "执行 shell 命令"
    allowed_domains: []
    requires_human_approval: false
    mapped: { plugin: "@deepseek-ai/dsh-tool-pwsh", tool: "pwsh" }
    used_by: [coding_agent, manager, multi-agent-report, video_creator, log_puller, proposal_planner, quality_inspector, task_conductor, task_decomposer, task_dispatcher, task_planner]
  board_cleanup:
    display_name: "清理可视化看板"
    description: "物理删除当前会话可视化看板中的历史卡片。 - surface_id：删除指定卡片 - all=true：清空当前会话整块看板 必须显式传入 confirm=true。session 由当前运行自动推导，模型不能指定其他会话。"
    allowed_domains: [manager]
    requires_human_approval: false
    mapped: { plugin: "@agentops/dsh-host/tools", tool: "board_cleanup" }
    used_by: [manager]
  classify_intent:
    display_name: "意图识别"
    description: "SupAgent 识别用户意图（编排 vs 直接对话）"
    allowed_domains: [manager]
    requires_human_approval: false
    mapped: null
    used_by: [manager]
    note: "无（意图识别交给 DSH agent-loop 的模型自身）"
  collect_child_result:
    display_name: "收集子任务结果"
    description: "阻塞等待子 run 完成（达到终态：completed/failed/cancelled/dormant/active）， 返回子 agent 的最终消息列表 + final_outputs + summary，供 manager 整合给用户。 这是 trigger_workflow 的标准伴侣：派任务必须 + 收结果。LLM 收到结果后可以： 1. 整合子 agent 的回复向用户汇报 2. 再调一次 trigger_workflow 触发下一个子任务 3. 把结果作为 emit_widget / memo 推给用户 阻塞时间：默认 600s（10 分钟），超时返回当前状态 + 部分结果。"
    allowed_domains: [manager]
    requires_human_approval: false
    mapped: null
    used_by: [manager]
    note: "无（DSH 子代理由运行时回传，无需工具）"
  data_analysis:
    display_name: "数据分析"
    description: "执行数据分析（统计/趋势/预测/归因）"
    allowed_domains: [smart_analysis]
    requires_human_approval: false
    mapped: null
    used_by: [manager, smart_analysis, smart_query]
    note: "无（DSH 侧走 sql_query + 模型自行分析）"
  db_migrate:
    display_name: "数据库迁移"
    description: "执行数据库迁移脚本（高危操作）"
    allowed_domains: [smart_ops]
    requires_human_approval: true
    mapped: null
    used_by: [smart_ops, manager, oa_assistant, proposal_planner, smart_analysis, smart_approval, smart_form, smart_query]
    note: "无（DSH 不向模型暴露迁移）"
  describe_database:
    display_name: "查询数据库表结构"
    description: "返回某数据库连接的表结构（可用 schema / 表清单 / 禁止访问的列）。 数据来源是 config/db_whitelist.yaml（白名单即 schema 授权），不连数据库。 当你要写 SQL 查询但不确定有哪些表/字段时，先调本工具看表结构。 常见场景：用户问业务数据 → describe_database('mysql:audit_reader') 看表 → 写 SELECT。"
    allowed_domains: [manager, smart_query, smart_analysis]
    requires_human_approval: false
    mapped: { plugin: "@agentops/dsh-db/tools", tool: "describe_database" }
    used_by: [manager]
  dispatch:
    display_name: "任务派发"
    description: "SupAgent 将子任务派发给业务域 Agent"
    allowed_domains: [manager]
    requires_human_approval: false
    mapped: null
    used_by: [manager]
    note: "无（DSH 用 DAG 引擎派发节点）"
  emit_alert:
    display_name: "监控告警推送"
    description: "把告警/提示推送到监控中心全局告警队列，经 SSE 通道实时推给前端（severity/tip_type 受控）"
    allowed_domains: [video_production, smart_ops]
    requires_human_approval: false
    mapped: null
    used_by: [log_puller, task_conductor, task_dispatcher, task_monitor]
    note: "无（DSH 侧告警走消息通道，不是模型可调工具）"
  export_report:
    display_name: "导出报表"
    description: "导出数据报表（Excel/PDF/CSV）"
    allowed_domains: [smart_query, smart_analysis]
    requires_human_approval: false
    mapped: null
    used_by: [smart_analysis, smart_query]
    note: "无（DSH 侧报告由 write_file 落盘）"
  extract_content:
    display_name: "内容提取"
    description: "从公网 http/https URL 提取网页、PDF、文档或音视频文本。 支持 article / pdf / doc / video / audio / auto 模式。 不读取本地文件路径，拒绝私网、回环、链路本地和云元数据地址； 仅允许 80/443 端口，限制重定向次数、响应大小与 MIME 类型。 不做 LLM 提炼，只做文本提取。"
    allowed_domains: [content_curator]
    requires_human_approval: false
    mapped: null
    used_by: [manager]
    note: "无（present_content 的上游解析已内置）"
  ffprobe_check:
    display_name: "视频质检"
    description: "用 ffprobe 解析 mp4 元数据，校验时长/分辨率/音轨"
    allowed_domains: [video_production]
    requires_human_approval: false
    mapped: null
    used_by: []
    note: "旧项目工具，本批 20 个 agent 未引用"
  finalize:
    display_name: "完成会话"
    description: "Agent 完成工具，标记当前回合结束"
    allowed_domains: []
    requires_human_approval: false
    mapped: null
    used_by: [log_analyst, log_puller, manager, multi-agent-report, proposal_planner, smart_analysis, smart_approval, smart_form, smart_ops, smart_query, task_conductor, task_decomposer, task_dispatcher, task_monitor, task_planner, video_creator, weekly-reporter]
    note: "无（DSH 的 agent-loop 自己收尾）"
  form_validate:
    display_name: "表单校验"
    description: "校验 OA 表单字段完整性、格式合法性"
    allowed_domains: [smart_form]
    requires_human_approval: false
    mapped: null
    used_by: [smart_form]
    note: "无（DSH 表单域未迁移）"
  get_run_supervision:
    display_name: "查看子任务进度"
    description: "查看某个子任务的执行状态和节点进度。SupAgent 用来监督子 agent 执行情况。 返回 Run 状态 + 各节点状态（running/completed/failed/skipped）+ 关键里程碑。 当用户问\"任务跑到哪了\"或\"进度怎么样\"时调用此工具。"
    allowed_domains: [manager]
    requires_human_approval: false
    mapped: null
    used_by: [manager]
    note: "无（DSH 无运行监管工具）"
  handoff:
    display_name: "handoff"
    description: ""
    allowed_domains: []
    requires_human_approval: false
    mapped: null
    used_by: [multi-agent-report, smart_query]
    note: "无（DSH 的节点端口由 DAG 引擎自动注入）"
  hyperframes_render:
    display_name: "hyperframes_render"
    description: "将 composition.html 渲染为 MP4 视频（自动包装为 hyperframes project + 复制媒体资源）"
    allowed_domains: [video_production]
    requires_human_approval: false
    mapped: null
    used_by: [video_creator]
    note: "无（视频渲染未迁移）"
  ingest_source:
    display_name: "知识库 Ingest"
    description: "LLM Wiki 的 Ingest 操作。把调用方提供的内容写入项目内知识域： raw 不可变原文、index 导航、log 时间线，以及可选 target_pages。 只接受 source_content；source_ref 是不透明标识，工具不会读取任何本地路径。"
    allowed_domains: [content_curator, proposal_planner, weekly-reporter]
    requires_human_approval: false
    mapped: null
    used_by: [manager, proposal_planner, weekly-reporter]
    note: "无（DSH 侧对应 knowledge_import_plan，只出计划不落库）"
  lint_knowledge:
    display_name: "知识库 Lint"
    description: "LLM Wiki Lint 操作工具。content_curator agent 的核心能力是冲突检测（FR-16）： 当新内容要归档时，需要先与历史笔记对比，检测 4 类冲突（fact/version/opinion/complement）。 本工具做程序化检查（contradictions/orphans/missing_pages/index_sync/dead_links/stale） + 输出结构化候选对，confidence 留空让 LLM 后续打分。auto_fix 仅对 index_sync 生效（标记问题， 实际修复需 agent 调 ingest_source 重新 ingest 或人工调整）。"
    allowed_domains: [content_curator, proposal_planner]
    requires_human_approval: false
    mapped: null
    used_by: []
    note: "旧项目工具，本批 20 个 agent 未引用"
  list_failed_runs:
    display_name: "失败任务查询"
    description: "查询最近 N 小时内失败的 DAG run + 节点失败事件（直接读 audit.db，不依赖后端进程）"
    allowed_domains: [smart_ops]
    requires_human_approval: false
    mapped: null
    used_by: [task_monitor]
    note: "无（DSH 无失败运行查询工具）"
  list_session_runs:
    display_name: "列出当前会话的所有子任务"
    description: "列出当前会话（Session）关联的所有子任务。SupAgent 用来查看自己调度过的所有任务。 不传 session_id 时自动用当前活跃 run_id 作为 session_id。 当用户问\"我有哪些任务在跑\"或\"这次会话做了什么\"时调用此工具。"
    allowed_domains: [manager]
    requires_human_approval: false
    mapped: null
    used_by: [manager]
    note: "无（改为页面能力 /agentops/agent-catalog/:id/usage）"
  list_tasks:
    display_name: "查询任务列表"
    description: "查询任务列表（只读），供 agent 查看任务列表与当前版本号。 支持按 project_id / status 过滤。"
    allowed_domains: [manager, task_planner]
    requires_human_approval: false
    mapped: { plugin: "@agentops/dsh-task/tools-v1", tool: "task_list" }
    used_by: [task_planner]
  log_list_tasks:
    display_name: "列出日志采集任务"
    description: "列出当前部署已配置的日志采集任务，用于在运行巡检前发现 log_task_id。"
    allowed_domains: [smart_ops]
    requires_human_approval: false
    mapped: { plugin: "@agentops/dsh-log-collection/tools", tool: "log_list_tasks" }
    used_by: [log_analyst, log_puller]
    note: "替代旧 config/patrol.yaml 的发现方式"
  log_query:
    display_name: "日志增量读取"
    description: "读取日志采集任务最近一次采集新增的区间（按级别过滤），不返回全天内容。"
    allowed_domains: [smart_ops]
    requires_human_approval: false
    mapped: { plugin: "@agentops/dsh-log-collection/tools", tool: "log_read_delta" }
    used_by: [log_analyst, smart_ops, proposal_planner]
    note: "映射到 log_read_delta：只读 deltaStart..deltaEnd"
  mark_draft_ingested:
    display_name: "标记草稿已归档"
    description: "归档成功后提交草稿摄取状态。必须传扫描阶段返回的 state_key 与 content_sha256；内容变化、路径越界或状态文件损坏时 fail-closed。"
    allowed_domains: [content_curator]
    requires_human_approval: false
    mapped: null
    used_by: []
    note: "旧项目工具，本批 20 个 agent 未引用"
  mm_image:
    display_name: "mm_image"
    description: "MiniMax CLI 图像生成，支持 --prompt-optimizer 自动优化 prompt"
    allowed_domains: [video_production]
    requires_human_approval: false
    mapped: null
    used_by: [manager, video_creator]
    note: "无（MiniMax 专用工具）"
  mm_search:
    display_name: "mm_search"
    description: "MiniMax CLI 网页搜索，用于 Step 1 收集视频素材数据"
    allowed_domains: [video_production]
    requires_human_approval: false
    mapped: null
    used_by: [video_creator]
    note: "无（MiniMax 专用工具）"
  mm_speech:
    display_name: "mm_speech"
    description: "MiniMax CLI 语音合成，用 speech-2.8-hd 高音质模型生成场景旁白"
    allowed_domains: [video_production]
    requires_human_approval: false
    mapped: null
    used_by: [video_creator]
    note: "无（MiniMax 专用工具）"
  oa_affair_detail:
    display_name: "OA 事项详情"
    description: "查询单条 OA 事项的流程状态与单据字段。需要 object_id（来自 oa_affair_query 结果）。detail_level：state 仅状态（最快）/ basic 状态+审批完成时间（默认）/ full 再加金额事由。调用者身份未知时拒绝。"
    allowed_domains: [oa_query, manager]
    requires_human_approval: false
    mapped: null
    used_by: [manager, oa_assistant]
    note: "无（单据表单读取接口未接入：CAP4 表单接口路径随部署而异，需先确认实例的表单读取端点）"
  oa_affair_query:
    display_name: "OA 事项查询"
    description: "查询致远 OA 协同事项列表。box：pending 待办（默认）/ done 已办。按发起时间区间与业务范围关键词过滤；查询对象锁定为 OA 实例绑定的身份（人员编码来自实例配置或 token 绑定，不接受入参）。只查协同事项，不含公文。返回事项标题、发起时间、状态、单据编号 object_id 与 OA 深链。注意：OA 不返回总数；不提供审批意见与当前办理人。"
    allowed_domains: [oa_query, manager]
    requires_human_approval: false
    mapped: { plugin: "@agentops/dsh-capability/oa-tools", tool: "oa_affair_query" }
    used_by: [manager, oa_assistant]
    note: "已接入：走能力中心的通用 token 认证 + 通用 REST 传输"
  oa_form_extract:
    display_name: "OA 表单提炼"
    description: "按审核视角提炼单据原料——归一化主表字段、明细子表、附件清单与下载。查询范围锁定为当前登录用户本人（不接受人员编码入参）。不做任何审核判断。"
    allowed_domains: [oa_query]
    requires_human_approval: false
    mapped: null
    used_by: [oa_assistant]
    note: "无（单据表单读取接口未接入：CAP4 表单接口路径随部署而异，需先确认实例的表单读取端点）"
  obsidian_vault:
    display_name: "Obsidian Vault 访问"
    description: "Obsidian Vault 旧路径只读兼容工具。仅当 OBSIDIAN_VAULT_ROOT 指向项目根内专用子目录时可读。 支持文件列举、读取、关键词搜索、tag 搜索、增量扫描和路径校验。 write_file 已永久禁用，始终返回 vault_write_disabled。 未启用时统一返回 vault_disabled，项目内知识沉淀不依赖本工具。"
    allowed_domains: [content_curator, proposal_planner, weekly-reporter]
    requires_human_approval: false
    mapped: null
    used_by: [manager, proposal_planner, weekly-reporter]
    note: "无（Obsidian 集成未迁移）"
  plan_tasks:
    display_name: "任务分解"
    description: "SupAgent 将任务拆解为多步骤计划"
    allowed_domains: [manager]
    requires_human_approval: false
    mapped: null
    used_by: [manager]
    note: "无（DSH 用 DAG 引擎排期）"
  present_content:
    display_name: "present_content"
    description: ""
    allowed_domains: []
    requires_human_approval: false
    mapped: { plugin: "@agentops/dsh-host/tools", tool: "present_content" }
    used_by: [manager, oa_assistant, smart_analysis, smart_query]
  artifact_build:
    display_name: "本地构建产物"
    description: "按已授权的 artifact-build 实例执行本地构建、校验输出并写 release manifest；不持有生产 SSH 凭证。"
    allowed_domains: [smart_ops]
    requires_human_approval: false
    mapped: { plugin: "@agentops/dsh-deployment/tools", tool: "artifact_build" }
    used_by: [build_operator]
  deployment_plan:
    display_name: "生产部署预检"
    description: "只读校验部署实例、artifact manifest、SSH host key 与远端前置条件，不改变生产。"
    allowed_domains: [smart_ops]
    requires_human_approval: false
    mapped: { plugin: "@agentops/dsh-deployment/tools", tool: "deployment_plan" }
    used_by: [deploy_operator]
  deployment_release:
    display_name: "生产部署发布"
    description: "审批后备份当前运行镜像、上传并校验 artifact、执行发布命令并检查健康。"
    allowed_domains: [smart_ops]
    requires_human_approval: true
    mapped: { plugin: "@agentops/dsh-deployment/tools", tool: "deployment_release" }
    used_by: [deploy_operator]
  deployment_status:
    display_name: "生产部署状态"
    description: "读取发布 journal、当前镜像与上一个健康备份。"
    allowed_domains: [smart_ops]
    requires_human_approval: false
    mapped: { plugin: "@agentops/dsh-deployment/tools", tool: "deployment_status" }
    used_by: [deploy_operator]
  deployment_rollback:
    display_name: "生产部署回滚"
    description: "审批后回滚到已记录健康的应用镜像；不恢复数据库。"
    allowed_domains: [smart_ops]
    requires_human_approval: true
    mapped: { plugin: "@agentops/dsh-deployment/tools", tool: "deployment_rollback" }
    used_by: [deploy_operator]
  pull_logs:
    display_name: "远程日志拉取"
    description: "按日志采集任务配置从绑定 SSH 实例只读拉取 active 日志文件到租户任务目录。"
    allowed_domains: [smart_ops]
    requires_human_approval: false
    mapped: { plugin: "@agentops/dsh-log-collection/tools", tool: "pull_logs" }
    used_by: [log_puller]
