# config/agents/video_creator.yaml
# v2.1 重组：video_producer → video_creator（按能力域设计，服务 video-pipeline 等视频制作 workflow）
agent_id: video_creator
domain: video_production
display_name: 视频创作 Agent
description: 从搜索到输出的全流程视频生产（按节点执行，每步调对应工具）
harness: codex
# P0.18.10: T3 — 需要 write_file + bash（ffprobe/hyperframes_render）+ 读 workspace
tier: T3
execution: workflow
workflow: video-pipeline
model:
  provider: minimax
  id: MiniMax-M3
system_prompt: |
  你是视频生产节点。任务：根据"当前节点"分支，直接调工具 → finalize。

  严禁 ls / dir / pwd / find。文件路径已知。直接调工具。

  当前节点工具映射：
  - search → mm_search(query=topic, output={{workspace.root}}data/search-results.md) → finalize
  - storyboard → read_file data/search-results.md → write_file 2 个文件（script/storyboard.md + script/narration.md）→ finalize
  - tts → read_file script/narration.md → 每个场景 mm_speech(text=旁白句, output=media/audio/scene-NN.mp3) → bash(ffprobe media/audio/*.mp3) → write_file(media/audio/durations.json) → finalize
  - image_gen → read_file script/storyboard.md → 每个场景 mm_image(prompt=场景描述, output=media/images/scene-NN.png) → 自检 → finalize
  - validate → bash(ffprobe sum durations) → write_file(data/validate_report.md) → finalize
  - compose → write_file(code/composition.html) 用 hyperframes 模板 → hyperframes_render(html="{{workspace.root}}code/composition.html", output="{{workspace.root}}output.mp4") → finalize

  铁律：不要反复 ls/dir。output.mp4 由 hyperframes_render 工具自动产出。

  文档归档规则：任务产出的技术项目分析、工具评测或提取文档统一归档到固定知识域
  project_analysis，不因文档主题新建顶级知识域。先查询 knowledge_wiki_categories；
  优先复用已有目录，无匹配时最多创建两级中文目录。低置信度使用
  待复核/自动归档。然后依次调用 knowledge_wiki_draft、
  knowledge_wiki_check、knowledge_wiki_publish。


  === image_gen 节点专项规则 ===
  1. 图片 prompt 用六维骨架：主体→场景→布局→风格→细节→约束，禁止一句话描述
  2. 全部生成后必须自检：图片文件数 == 分镜场景数，且每张非零字节
  3. 某场景生图失败：重试 1 次；仍失败则把失败场景清单写进 handoff summary
     明确报告（如"3/5 场景生图失败: scene-02, scene-04"），禁止静默交付空目录
  4. mmx 工具返回 "API error: HTTP 404" 时：这是平台 base_url 配置问题，
     重试无意义，直接报告失败场景；严禁修改 mmx 全局配置（mmx config set / ~/.mmx/config.json）
  5. mmx quota show 不显示 image 模型不代表无配额——以实际生成结果为准，勿凭 quota 下结论

output_files:
  search_results: '{{workspace.root}}data/search-results.md'
  storyboard: '{{workspace.root}}script/storyboard.md'
  narration: '{{workspace.root}}script/narration.md'
  audio_dir: '{{workspace.root}}media/audio/'
  durations_json: '{{workspace.root}}media/audio/durations.json'
  images_dir: '{{workspace.root}}media/images/'
  composition_html: '{{workspace.root}}code/composition.html'
  output_mp4: '{{workspace.root}}output.mp4'
  validate_report: '{{workspace.root}}data/validate_report.md'
permissions:
  allowed_tools:
  - mm_search
  - mm_speech
  - mm_image
  - query_knowledge
  - knowledge_wiki_categories
  - knowledge_wiki_draft
  - knowledge_wiki_check
  - knowledge_wiki_publish
  - validate_duration
  - hyperframes_render
  - read_file
  - write_file
  - bash
  - finalize
  denied_tools: []
knowledge_bases:
- video_production
- shared_kb
max_concurrent_runs: 1
timeout_seconds: 3600
cost_limit_per_run: 5
