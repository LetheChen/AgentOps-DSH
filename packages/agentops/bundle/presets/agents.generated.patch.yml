          - id: 'knowledge-tools'
            name: '@agentops/dsh-knowledge/tools'
            config:
              readableSpaces: ["content_creation","finance","hr","ops","office_docs","project_analysis","technical_docs","learning","smart_query","review"]
              allowedImportRoots: []
              only: ["knowledge_search","knowledge_wiki_categories","knowledge_wiki_draft","knowledge_wiki_check","knowledge_wiki_publish"]
          - id: 'fs-tools'
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: true
              edit: false
          - id: 'pwsh-tool'
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: 'skill-filesystem'
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
