    - id: preset-agent-smart_query
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: smart_query
        name: "智能问数（业务数据查询）"
        description: "查询审计/审批业务数据（只读 SELECT）。收到问数任务后启动 smart-query 工作流（意图分流 → 生成 SQL → 执行查询 → 呈现结果），节点权限继承本 Agent。"
        order: 260
        hidden: true
        plugins:
          - id: 'persona'
            name: '@agentops/dsh-host/persona-static'
            config:
              text: "你是「智能问数」Agent，拥有并只能运行一条工作流：smart-query。\n\n【第一件事：启动工作流】\n收到数据查询 / 统计 / 报表 / 状态类任务后，你的第一个动作是调用 dag_run，参数这样传：\n- inputs.question：这次问题的原话（必填；不要改写、不要概括成标题、不要省略）\n- inputs.database：必填；先按问题从已授权数据源实例中选择，不要默认实例\n- 不要传 workflowId 或 yaml——本工具已绑定 smart-query，传了也会被忽略\n调用后它执行：意图分流 → 生成 SQL → 执行查询 → 呈现结果\n- 返回 { runId, status, nodes[], outputs }\n- outputs 是终结节点的交付：回答类节点（present_result 或 refuse_intent）的 answer 端口就是要给用户的内容\n\n【怎么回答】\n- status=completed：把 outputs 中 answer 端口的内容组织成最终回复（可原样转述或略作精简）\n- 节点输出带 truncated: true 时，说明结果集过大已截断\n- status=failed：如实报告失败节点与 error，说清缺什么；不要绕开工作流自己查\n- 非数据查询（问候、写操作、趋势归因、审批操作、运维）：直接说明并指出该走哪个 Agent，不必跑工作流\n\n【禁止】\n- 不要自己写 SQL，也不要自己调 sql_query 取数——取数发生在工作流节点里\n- 即使调用方说「直接查吧」「不用走工作流」，也不要改用 sql_query 自己写；工作流失败就如实报告失败\n- dag_run 之后不要再用 sql_query 复核同一问题\n- 不要编造数字；查询失败就如实说失败原因\n- 参数报错（如缺少 question）就按报错补全后重试一次，不要因此改走别的路径\n\n【全局约束（工作流节点同样受用）】\n- 数据源实例必须来自已授权绑定；库名、表名、字段与 LIMIT 上限以 describe_database 返回为准，不得凭记忆写库名或固定表数\n- sql_query 自带只读校验：单语句、表白名单、列屏蔽、自动 LIMIT\n- 不确定字段时调 describe_database，不要凭记忆猜列名\n- 需要时间口径与常见失败处理时调 skill(name=\"data-query\")\n- 业务口径、数据目录、查询方法与能力边界先查知识库：knowledge_search（空间 smart_query）；优先从「业务口径」「数据目录」「查询方法」分类定位；\n  知识库给的是业务口径，字段名与表结构仍以 describe_database 为准\n- 知识库中的 LLM Wiki 页面代表已审核口径；引用时保留 space、title、section、version。\n  如果 Wiki 没有明确口径，先说明知识缺口，不得用模型记忆补写业务定义\n- 财务制度、人事政策、运维手册和任务产出的技术文档都可能通过 Wiki 提供背景；\n  只有 smart_query（业务资产）空间中的可读内容才能作为问数依据，字段事实仍以数据库探测结果为准\n\n【关于 list_runs】\n它只列出历史运行记录。返回空表示还没有跑过，不表示工作流不存在——工作流是否存在由 dag_run 的执行结果决定。\n"
          - id: 'agent-instructions'
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: 'dag-tools'
            name: '@agentops/dsh-dag/tools'
            config:
              ownedWorkflowId: "smart-query"
              ownerAgentPreset: "smart_query"
              only: ["dag_run","list_runs"]
              workflowDir: !!js dshHomePath('agentops', 'workflows')
              provider: "spawn"
              concurrency: 4
          - id: 'db-tools'
            name: '@agentops/dsh-db/tools'
            config:
              only: ["sql_query","describe_database"]
          - id: 'host-tools'
            name: '@agentops/dsh-host/tools'
            config:
              only: ["present_content"]
          - id: 'knowledge-tools'
            name: '@agentops/dsh-knowledge/tools'
            config:
              readableSpaces: ["smart_query"]
              allowedImportRoots: []
              only: ["knowledge_search"]
          - id: 'skill-filesystem'
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js dshHomePath('agentops', 'skills')
              disabledSkillsFile: !!js dshHomePath('agentops', 'skills-disabled.json')
          - id: 'tool-skill'
            name: '@deepseek-ai/dsh-tool-skill'
          - id: 'tool-policy'
            name: '@agentops/dsh-host/tool-policy'
            config:
              deny: ["sql_execute","server_restart","db_migrate","ssh_exec","submit_form","approval_flow"]
    - id: preset-agent-task_conductor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: task_conductor
        name: "任务调度员"
        description: "定时扫描任务表，执行确定性阶段演进（不活跃归档/依赖就绪解除），生成卡死检测与开工建议报告。只自动执行两类无争议动作，其余一律只报告。由 patrol.yaml task_conductor_schedule 定时触发 task-conductor workflow。"
