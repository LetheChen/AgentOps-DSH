          - id: 'tool-policy'
            name: '@agentops/dsh-host/tool-policy'
            config:
              deny: ["bash","trigger_workflow","task_advance_stage","wecom_notify","task_execute_coding","pwsh","task_advance"]
    - id: preset-agent-task_inbox
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: task_inbox
        name: "收件箱分诊台"
        description: "接收所有入口的工单记录（人工、bot、agent、connector），按业务类型与门槛分诊到 triaged / ready， 并把就绪任务按并发预算派发执行。只做分诊与调度，不做任务分解与规划。"
        order: 300
