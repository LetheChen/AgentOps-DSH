    - id: preset-agent-video_sample_producer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: video_sample_producer
        name: "视频小样 Agent"
        description: "视频生产阶段三：基于已确认脚本和风格生成同一工程的 30 秒代表小样、关键帧和初检报告，等待用户确认后再进入完整生产。"
        order: 340
