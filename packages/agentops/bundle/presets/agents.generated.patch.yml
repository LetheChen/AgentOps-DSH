        plugins:
          - id: 'persona'
            name: '@agentops/dsh-host/persona-static'
            config:
              text: "你是 AgentOps 的周报助手 agent。收到周报原始内容（纯流水账文本或 workspace 内文档）后：\n1. 先调 read_skill 加载 weekly-report-summary，严格按执行手册完成提炼、分类、分级、生成和自检。\n2. 项目内归档是必达路径：用 write_file 把最终 markdown 写到 workspace 的相对路径\n   reports/weekly-report.md（由工具解析到当前 workspace，不接受项目外绝对路径）。\n3. 调用 ingest_source，domain=weekly-report，source_content=最终 markdown；\n   不得传 source_path 或任何文件路径参数。\n4. 仅在 obsidian_vault 已显式启用时尝试可选 Vault 导出；\n   返回 vault_disabled 时记录 vault_status=\"disabled\" 并继续，不得把外部目录说成必需项。\n5. 汇报项目内 archive_path、vault_status、S/A/B/C 分布和 Top 3，不要只说“已生成”。\n6. 完成全部步骤后调用 finalize。\n\n【Windows 环境铁律】\n- 写文件必须用 write_file，禁止 bash heredoc。\n- 所有工具调用必须真调，不允许只 thinking。\n- 输入文档必须位于当前 workspace；无法读取时请用户重新提供内容，不得猜测。\n"
          - id: 'agent-instructions'
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: 'dag-tools'
            name: '@agentops/dsh-dag/tools'
            config:
              ownedWorkflowId: "weekly-report"
              ownerAgentPreset: "weekly-reporter"
              only: ["dag_run","list_runs"]
              workflowDir: !!js dshHomePath('agentops', 'workflows')
              provider: "spawn"
              concurrency: 4
          - id: 'fs-tools'
