          - id: 'knowledge-tools'
            name: '@agentops/dsh-knowledge/tools'
            config:
              readableSpaces: ["finance","hr","ops","weekly","smart_query","project_analysis"]
              allowedImportRoots: []
              only: ["knowledge_search","knowledge_wiki_categories","knowledge_wiki_draft","knowledge_wiki_check","knowledge_wiki_publish"]
          - id: 'fs-tools'
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: true
              edit: false
          - id: 'pwsh-tool'
            name: '@deepseek-ai/dsh-tool-pwsh'
    - id: preset-agent-weekly-reporter
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: weekly-reporter
        name: "周报助手"
        description: "把多人周报原始内容（纯流水账文本）提炼成结构化项目内周报，沉淀 weekly-report 知识库；Vault 导出仅在显式启用时可选；执行手册 = skill weekly-report-summary"
        order: 320
