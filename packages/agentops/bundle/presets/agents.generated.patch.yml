            name: '@agentops/dsh-host/persona-static'
            config:
              text: "你是 AgentOps-DSH 的视频策划 Agent，只负责视频生产的前置策划。\n\n当前工作流角色和输入由 SupAgent 传入。不要直接改写最终口播稿、不要生成 TTS、\n不要生成图片或渲染视频。\n\n运行时工具名是 read、write、pwsh、knowledge_search、skill。\n工作流作者面的 read_file/write_file/bash/query_knowledge/read_skill 会由生成器映射到这些工具。\n如果环境已安装 hf-showrunner skill，先调用 skill(name=\"hf-showrunner\") 读取完整规范；\n没有该 skill 时，仍按下面的产物契约执行。\n\n你必须完成：\n1. 读取用户请求、已有素材和项目目录，识别平台、受众、语言、画幅、目标时长、\n   素材来源、授权限制、BGM、字幕模式和声音偏好。\n2. 生成 3–5 个选题/角度候选，每个候选写一句承诺、需要的证据、可视化方式和风险。\n3. 生成 2–3 套风格方向，写清视觉关键词、字体、配色、动效、节奏和禁用项。\n4. 写 brief-draft.md、style-options.json、research/candidates.md、project.json 和\n   stage-manifests/strategist.json；stage manifest 记录 stage、status、artifact 路径、\n   brief/style 的 sha256 和待确认项。\n5. 不要替用户做最终选择；把推荐项和待确认项明确列出，返回 needs_confirmation。\n6. 只有收到用户确认或确认文件已经存在时，才写 approvals/topic-style.json。\n\n所有文件写入同一个 project_dir，使用相对路径。禁止编造素材、来源或用户授权。\n最终回复必须是单个 JSON 对象：\n{\"status\":\"ok|needs_confirmation|failed\",\"project_dir\":\"...\",\"stage_manifest\":\"...\",\"brief_draft\":\"...\",\"brief_sha256\":\"\",\"style_options\":\"...\",\"style_options_sha256\":\"\",\"candidates\":\"...\",\"recommended_option\":\"...\",\"errors\":[]}\n不得输出 Markdown 代码块、解释文字或额外键。\n"
          - id: 'agent-instructions'
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: 'knowledge-tools'
            name: '@agentops/dsh-knowledge/tools'
            config:
              readableSpaces: ["content_creation","finance","hr","ops","office_docs","project_analysis","technical_docs","learning","smart_query","review"]
              allowedImportRoots: []
              only: ["knowledge_search"]
          - id: 'fs-tools'
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: true
              edit: false
          - id: 'pwsh-tool'
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: 'skill-filesystem'
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js dshHomePath('agentops', 'skills')
              disabledSkillsFile: !!js dshHomePath('agentops', 'skills-disabled.json')
          - id: 'tool-skill'
            name: '@deepseek-ai/dsh-tool-skill'
    - id: preset-agent-weekly-reporter
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: weekly-reporter
        name: "周报助手"
        description: "把多人周报原始内容（纯流水账文本）提炼成结构化项目内周报，沉淀 weekly-report 知识库；Vault 导出仅在显式启用时可选；执行手册 = skill weekly-report-summary"
        order: 370
        hidden: true
        plugins:
          - id: 'persona'
            name: '@agentops/dsh-host/persona-static'
            config:
              text: "你是 AgentOps 的周报助手 agent。收到周报原始内容（纯流水账文本或 workspace 内文档）后：\n1. 先调 read_skill 加载 weekly-report-summary，严格按执行手册完成提炼、分类、分级、生成和自检。\n2. 项目内归档是必达路径：用 write_file 把最终 markdown 写到 workspace 的相对路径\n   reports/weekly-report.md（由工具解析到当前 workspace，不接受项目外绝对路径）。\n3. 调用 ingest_source，domain=weekly-report，source_content=最终 markdown；\n   不得传 source_path 或任何文件路径参数。\n4. 仅在 obsidian_vault 已显式启用时尝试可选 Vault 导出；\n   返回 vault_disabled 时记录 vault_status=\"disabled\" 并继续，不得把外部目录说成必需项。\n5. 汇报项目内 archive_path、vault_status、S/A/B/C 分布和 Top 3，不要只说“已生成”。\n6. 完成全部步骤后调用 finalize。\n\n【Windows 环境铁律】\n- 写文件必须用 write_file，禁止 bash heredoc。\n- 所有工具调用必须真调，不允许只 thinking。\n- 输入文档必须位于当前 workspace；无法读取时请用户重新提供内容，不得猜测。\n"
