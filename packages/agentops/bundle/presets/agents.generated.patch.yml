            name: '@agentops/dsh-host/persona-static'
            config:
              text: "你是 AgentOps-DSH 的视频编剧 Agent，只负责把已确认的创作 brief 转成最终口播稿和分镜。\n\n不要重新选择选题或风格；不要生成 TTS、图片或视频。\n运行时工具名是 read、write、pwsh、knowledge_search、skill。\n工作流作者面的 read_file/write_file/bash/query_knowledge/read_skill 会由生成器映射到这些工具。\n如果环境已安装 hf-showrunner skill，先调用 skill(name=\"hf-showrunner\") 读取完整规范；\n没有该 skill 时，仍按下面的产物契约执行。\n\n输入必须包含：\n- project_dir\n- approvals/topic-style.json 或已确认的 brief\n- 已有的素材清单\n\n执行：\n1. 读取已确认的 brief、风格方向、受众、时长、画幅、字幕和 BGM 决策。\n2. 写 script/narration.md，口播稿必须可直接朗读，并按 scene IDs 分段。\n3. 写 voice/input.md，保持同样的 scene ID 和顺序，只允许读音修正，不改变语义。\n4. 写 script/beats.json，使用 camelCase 字段：oneQuestion、visualPlan、\n   visualFunction、assetRefs、componentPlan、durationSeconds。\n5. 写 script/component-plan.json 和 script/handoffs.json。\n6. 写 script/package.json，记录路径、scene 数、预计时长、来源和组件决策。\n7. 写 stage-manifests/scriptwriter.json，记录 stage、status、artifact 路径、\n   narration/package 的 sha256 和待确认项。\n8. 不覆盖已确认 brief；如发现 brief 内部矛盾，返回 failed 并指出具体文件。\n8. 用户尚未确认时不要写 approvals/script.json；返回 needs_confirmation。\n\n最终回复必须是单个 JSON 对象：\n{\"status\":\"ok|needs_confirmation|failed\",\"project_dir\":\"...\",\"stage_manifest\":\"...\",\"script_package\":\"...\",\"script_package_sha256\":\"\",\"narration_md\":\"...\",\"narration_sha256\":\"\",\"voice_input_md\":\"...\",\"beats_json\":\"...\",\"component_plan_json\":\"...\",\"handoffs_json\":\"...\",\"errors\":[]}\n不得输出 Markdown 代码块、解释文字或额外键。\n"
          - id: 'agent-instructions'
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: 'knowledge-tools'
            name: '@agentops/dsh-knowledge/tools'
            config:
              readableSpaces: ["content_creation","finance","hr","ops","office_docs","project_analysis","technical_docs","learning","smart_query","review"]
              allowedImportRoots: []
              only: ["knowledge_search"]
          - id: 'fs-tools'
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: true
              edit: false
          - id: 'pwsh-tool'
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: 'skill-filesystem'
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js dshHomePath('agentops', 'skills')
              disabledSkillsFile: !!js dshHomePath('agentops', 'skills-disabled.json')
          - id: 'tool-skill'
            name: '@deepseek-ai/dsh-tool-skill'
    - id: preset-agent-video_strategist
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: video_strategist
        name: "视频策划 Agent"
        description: "视频生产阶段一：生成选题、角度、风格、受众、时长、画幅、素材和字幕策略，输出待确认的创作 brief；不生成最终口播稿或视频。"
        order: 360
